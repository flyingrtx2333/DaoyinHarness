name: Static checks and package Harness evaluation release

# Owner mandate (2026-09-07): no simulated tests. This workflow only builds/packages.
# Real-model acceptance is a separate, explicitly budgeted small-sample operation.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact committed Harness SHA to check and package (not model acceptance)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
      - name: Verify pinned source
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          if ($env:EXPECTED_REVISION -notmatch '^[a-f0-9]{40}$') { throw 'Use a full commit SHA' }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_REVISION) { throw 'Source revision mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked Windows dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Build all workspaces
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Static typecheck and lint (not behavior tests)
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
      - name: Package the committed source (real-model validation not run)
        run: |
          node scripts/build-cloud-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging failed' }
          node scripts/build-workbench-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Workbench packaging failed' }
          $revision = (git rev-parse HEAD).Trim()
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -Recurse ".cache/cloud-release/$revision" release/runtime
          Copy-Item -Recurse ".cache/workbench-release/$revision" release/workbench
          [ordered]@{ revision=$revision; environment='windows-2025'; validation='static-and-build-only'; simulatedTests='disabled-by-owner-policy'; realModelValidation='not-run'; paidCalls=0; deploymentPerformed=$false } | ConvertTo-Json | Set-Content -Encoding utf8 release/validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: harness-evaluation-${{ inputs.revision }}
          path: release/
          retention-days: 7
          if-no-files-found: error
