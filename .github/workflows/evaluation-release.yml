name: Validate and package Harness evaluation release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact committed Harness SHA to validate and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
      - name: Verify pinned source
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          if ($env:EXPECTED_REVISION -notmatch '^[a-f0-9]{40}$') { throw 'Use a full commit SHA' }
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_REVISION) { throw 'Source revision mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked Windows dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Build all workspaces
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Strict typecheck and lint
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Lint failed' }
      - name: Start isolated Windows PostgreSQL
        run: |
          $bin = $env:PGBIN
          if (!(Test-Path "$bin\initdb.exe")) { throw 'Runner PostgreSQL binaries missing' }
          $data = Join-Path $env:RUNNER_TEMP 'harness-eval-pg'
          & "$bin\initdb.exe" -D $data -U postgres -A trust --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'Isolated initdb failed' }
          & "$bin\pg_ctl.exe" -D $data -l "$env:RUNNER_TEMP\harness-eval-pg.log" -o '-h 127.0.0.1 -p 15432' -w start
          if ($LASTEXITCODE -ne 0) { throw 'Isolated PostgreSQL start failed' }
          & "$bin\createdb.exe" -h 127.0.0.1 -p 15432 -U postgres harness_evaluation_test
          if ($LASTEXITCODE -ne 0) { throw 'Isolated database creation failed' }
          'DAOYIN_TEST_POSTGRES_URL=postgresql://postgres@127.0.0.1:15432/harness_evaluation_test' >> $env:GITHUB_ENV
      - name: Unit, protocol, security and real PostgreSQL tests
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Compiled workbench browser checks (mocked API, no paid calls)
        run: |
          node scripts/verify-evaluation-workbench.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Evaluation browser verification failed' }
          node scripts/verify-cloud-websocket.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WebSocket regression failed' }
          node scripts/verify-account-access.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Account regression failed' }
      - name: Package the validated commit
        run: |
          node scripts/build-cloud-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging failed' }
          node scripts/build-workbench-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Workbench packaging failed' }
          $revision = (git rev-parse HEAD).Trim()
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -Recurse ".cache/cloud-release/$revision" release/runtime
          Copy-Item -Recurse ".cache/workbench-release/$revision" release/workbench
          [ordered]@{ revision=$revision; validation='windows-2025'; database='isolated-postgresql'; browser='compiled-ui-mocked-api'; paidCalls=0; deploymentPerformed=$false } | ConvertTo-Json | Set-Content -Encoding utf8 release/validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: harness-evaluation-${{ inputs.revision }}
          path: release/
          retention-days: 7
          if-no-files-found: error
      - name: Stop only this job's PostgreSQL
        if: always()
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'harness-eval-pg'
          if (Test-Path "$data\postmaster.pid") { & "$env:PGBIN\pg_ctl.exe" -D $data -m fast -w stop }
