# Include inside www.daoyintech.com's existing HTTPS server.
# Keep hashed assets across releases so already-open pages remain usable.
location = /harness {
    return 308 /harness/;
}
location ^~ /harness/assets/ {
    alias /opt/daoyin-harness/workbench/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /harness/ {
    alias /opt/daoyin-harness/workbench/current/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Account avatars are platform-owned profile URLs (including HTTPS object storage).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' wss://www.daoyintech.com; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
